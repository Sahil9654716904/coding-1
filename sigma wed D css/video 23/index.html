<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        span{
            border: 3px solid red;
        }
/* div{
    border: 2px solid black;
} */
 .box{
    border: 2px solid black;
    /* convert block line to inline */
    /* display: inline; */
    display: inline-block;
    padding: 45px;
    width: 344px;
    margin: 34px;
 }
.box1{
    /* display: none; */
    /* visibility:hidden; */
 }
    </style>
</head>
<body>
    <!-- block line element -->
    <div class="box box1">
        I am a boy
    </div>
    <div class="box">
        also a nice box
    </div>
    <!-- inline element -->
    <span>i am a good</span>
    <span>boy</span>
</body>
</html>
