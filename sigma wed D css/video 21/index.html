<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* the specification of this selector is 1 */
        h1 {
            color: aqua;
        }

        /* the specification of this selector is 10 */
        .yellow {
            color: yellow;
        }
        /* the specification of this selector is 1+10 */
        h1.yellow {
            color: yellow;
        }

        /* the specification of this selector is 10 */

        .cred {
            color: red;
        }

        /* the specification of this selector is 10 */
        .cpurple {
            color: purple;
        }

        /* this is an example of attribute selector.  the specification of this selector is 10. */

        [data-x=a]{ 
            color:maroon ;
        } 
    </style>
</head>

<body>
    <div>
        <h1 class="yellow cred cpurple" data-x="a">CSS Specification</h1>
    </div>
</body>

</html>
