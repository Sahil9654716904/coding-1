<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadow,outlines </title>
    <style>
        /* box-shadow : h v blur spread color inset */
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 5px 5px  rgb(0, 255, 183) ;
        }
        .text-element{
            text-shadow: 3px 4px 3px red ;
            outline: 2px solid black;
            border: 2px solid greenyellow;
            outline-offset: 20px;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="box">
        I am a box
    </div>
    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsa quae, doloribus inventore accusantium iste ut cupiditate maxime voluptatem rem molestiae! Architecto consectetur qui obcaecati fugiat magni reprehenderit eveniet aut eius, soluta ullam, pariatur quia?
    </p>
</body>

</html>
